              "<div class='stack' style='gap:4px'>" +
                "<span class='panel__title'>Global IOC &amp; Rule Center</span>" +
                "<span class='muted' style='font-size:12px'>" +
                  "<span class='mono num' data-total>" + window.fmt.int(totalIocs()) + "</span> indicators &amp; rules across all feeds" +
                "</span>" +
              "</div>" +
              "<div class='panel__tools'>" +
                "<button type='button' class='btn btn--primary' data-push>" +
                  "<svg class='rail__icon' viewBox='0 0 24 24' width='16' height='16' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>" +
                    "<path d='M12 19V5'/><path d='M5 12l7-7 7 7'/>" +
                  "</svg>" +
                  "Push to fleet" +
                "</button>" +
              "</div>" +
            "</div>" +
            "<div class='panel__body'>" +
              "<div class='tabs' role='tablist' aria-label='IOC categories'>" + tabsHtml + "</div>" +
              "<div class='stack' data-tabbody style='margin-top:var(--gap)'>" + tabBody("ips") + "</div>" +
            "</div>" +
          "</div>" +
        "</div>";
    },

    init: function (root) {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var tabs = Array.prototype.slice.call(root.querySelectorAll(".tab[data-tab]"));
      var bodyEl = root.querySelector("[data-tabbody]");

      function activate(tab) {
        if (!tab) return;
        tabs.forEach(function (t) {
          var on = t === tab;
          t.classList.toggle("is-active", on);
          t.setAttribute("aria-selected", on ? "true" : "false");
          t.setAttribute("tabindex", on ? "0" : "-1");
        });
        var key = tab.getAttribute("data-tab");
        if (!bodyEl) return;
        if (reduce) {
          bodyEl.innerHTML = tabBody(key);
          return;
        }
        bodyEl.style.transition = "opacity .16s ease, transform .16s ease";
        bodyEl.style.opacity = "0";
        bodyEl.style.transform = "translateY(4px)";
        setTimeout(function () {
          bodyEl.innerHTML = tabBody(key);
          void bodyEl.offsetHeight;
          bodyEl.style.opacity = "1";
          bodyEl.style.transform = "translateY(0)";
        }, 150);
      }

      tabs.forEach(function (t, i) {
        t.addEventListener("click", function () { activate(t); });
        t.addEventListener("keydown", function (e) {
          var idx = i;
          if (e.key === "ArrowRight" || e.key === "ArrowDown") {
            e.preventDefault();
            var n = tabs[(idx + 1) % tabs.length];
            n.focus(); activate(n);
          } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
            e.preventDefault();
            var p = tabs[(idx - 1 + tabs.length) % tabs.length];
            p.focus(); activate(p);
          } else if (e.key === "Home") {
            e.preventDefault(); tabs[0].focus(); activate(tabs[0]);
          } else if (e.key === "End") {
            e.preventDefault(); tabs[tabs.length - 1].focus(); activate(tabs[tabs.length - 1]);
          }
        });
      });

      var pushBtn = root.querySelector("[data-push]");
      if (pushBtn) {
        pushBtn.addEventListener("click", function () {
          var n = (window.MOCK && window.MOCK.stats && window.MOCK.stats.endpointsOnline) || 0;
          window.toast("IOCs pushed to " + window.fmt.int(n) + " endpoints", "good");
        });
      }

      var totalEl = root.querySelector("[data-total]");
      if (totalEl && window.countUp) {
        window.countUp(totalEl, totalIocs(), { dur: 700 });
      }
    }
  };
})();

          '<span class="port-pill__meta"><span class="mono muted">'+cp.proto+'/'+cp.port+'</span>'+
            (listening?'<span class="port-listen">&#9679; listening</span>':'<span class="muted" style="font-size:10.5px">&mdash;</span>')+'</span>'+
        '</button>';
      }).join('') + '</div>';
    }

    function obsTable(dev, closedSet){
      var obs=dev.observed||[];
      if(!obs.length) return '<div class="muted" style="font-size:12px;padding:8px 2px">No listening ports reported yet &mdash; the agent sends them on its next heartbeat (&le;60s). Use <b>Scan</b> to request now.</div>';
      var rows=obs.map(function(o){
        var k=key(o.proto,o.port), isClosed=!!closedSet[k];
        var btn='<button class="btn btn--ghost btn--sm" data-toggle data-agent="'+esc(dev.agent_id)+'" data-port="'+o.port+'" data-proto="'+esc(o.proto)+'" data-state="'+(isClosed?'closed':'open')+'">'+(isClosed?'Re-open':'Close')+'</button>';
        return '<tr'+(isClosed?' style="border-left:3px solid var(--crit)"':'')+'>'+
          '<td class="mono">'+esc(o.proto)+'/'+o.port+'</td>'+
          '<td class="mono muted">'+esc(o.laddr||'-')+'</td>'+
          '<td>'+(o.proc?'<span class="badge badge--muted">'+esc(o.proc)+'</span>':'<span class="muted">&mdash;</span>')+'</td>'+
          '<td>'+(isClosed?'<span class="badge badge--crit">CLOSED</span>':'<span class="badge badge--good">OPEN</span>')+'</td>'+
          '<td style="text-align:right">'+btn+'</td></tr>';
      }).join('');
      return '<div class="tblwrap"><table class="tbl tbl--dense">'+
        '<thead><tr><th>Port</th><th>Address</th><th>Process</th><th>State</th><th style="text-align:right">Action</th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table></div>';
    }

    function card(dev){
      var closedSet={}, obsSet={};
      (dev.closed||[]).forEach(function(c){closedSet[key(c.proto,c.port)]=c;});
      (dev.observed||[]).forEach(function(o){obsSet[key(o.proto,o.port)]=true;});
      var online=(dev.status||'').toLowerCase()==='online';
      var isOpen=!!expanded[dev.agent_id];
      var nObs=(dev.observed||[]).length, nClosed=(dev.closed||[]).length;
      return '<div class="panel port-dev'+(isOpen?' is-open':'')+'" data-device="'+esc(dev.agent_id)+'" style="margin-top:var(--gap)">'+
        '<div class="panel__head port-dev__head" data-toggle-card>'+
          '<div class="panel__title row" style="gap:8px;align-items:center">'+
            '<span class="port-chev">&#9654;</span>'+
            '<span class="dot '+(online?'dot--live':'dot--off')+'"></span>'+
            esc(dev.name||dev.agent_id)+
            '<span class="badge badge--muted">'+esc(dev.platform||'-')+'</span>'+
          '</div>'+
          '<div class="panel__tools port-dev__summary">'+
            '<span class="chip mono">'+esc(dev.ip||'-')+'</span>'+
            '<span class="chip">'+nObs+' listening</span>'+
            (nClosed?'<span class="chip" style="color:var(--crit)">'+nClosed+' closed</span>':'')+
            '<span class="chip mono" title="ports last reported">'+ago(dev.ports_at)+'</span>'+
            '<button class="btn btn--ghost btn--sm" data-scan="'+esc(dev.agent_id)+'" title="Ask this agent to re-scan its ports now">&#8635; Scan</button>'+
          '</div>'+
        '</div>'+
        '<div class="panel__body port-dev__body">'+
          '<div class="eyebrow">Common ports &mdash; click a tile to close or open it at the host firewall</div>'+
          commonGrid(dev, closedSet, obsSet)+
          '<div class="obs' + (obsOpen[dev.agent_id] ? ' is-open' : '') + '">' +
            '<div class="eyebrow obs-head" data-obs-toggle>' +
              '<span class="obs-chev">&#9654;</span> Listening ports observed on host ' +
              '<span class="chip mono" style="margin-left:2px">' + nObs + '</span>' +
              '<span class="muted" style="font-size:11px;font-weight:400">' +
                (obsOpen[dev.agent_id] ? '' : ' — click to expand') + '</span>' +
            '</div>' +
            '<div class="obs-body">' + obsTable(dev, closedSet) + '</div>' +
          '</div>' +
          '<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center">'+
            '<span class="eyebrow">Close a custom port:</span>'+
            '<input class="input mono" data-cport placeholder="port e.g. 8443" style="width:130px" inputmode="numeric">'+
            '<select class="input" data-cproto style="width:88px"><option value="tcp">tcp</option><option value="udp">udp</option></select>'+
            '<input class="input" data-creason placeholder="reason (optional)" style="flex:1;min-width:140px">'+
            '<button class="btn btn--primary btn--sm" data-cclose data-agent="'+esc(dev.agent_id)+'">Close port</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    }

    function toggleCard(aid){
      expanded[aid]=!expanded[aid];
      var el=listEl.querySelector('[data-device="'+cssEsc(aid)+'"]');
      if(el) el.classList.toggle('is-open', !!expanded[aid]);
    }

    function scan(aid, btn){
      var dev=DEVS[aid]; var baseline=dev?dev.ports_at:null;
      if(btn){ btn.disabled=true; btn.innerHTML='scanning&hellip;'; }
      if(window.toast) window.toast('Requesting port scan - waiting for the agent to report&hellip;','info');
      return reqJSON('POST','/api/agents/'+encodeURIComponent(aid)+'/ports/scan').then(function(){
        var tries=0;
        return new Promise(function(resolve){
          (function poll(){
            tries++;
            reqJSON('GET','/api/ports').then(function(d){
              var nd=(d.devices||[]).filter(function(x){return x.agent_id===aid;})[0];
              if(nd && nd.ports_at && nd.ports_at!==baseline){ ingest(d); resolve(true); return; }
              if(tries>=14){ ingest(d); resolve(false); return; }
              setTimeout(poll,5000);
            }).catch(function(){ resolve(false); });
          })();
        });
      }).then(function(ok){
        if(window.toast) window.toast(ok?('Ports refreshed for '+(dev?dev.name:aid)):'Scan queued - agent will report on next check-in', ok?'good':'info');
      });
    }

    function ingest(data){
      COMMON=data.common_ports||COMMON;
      var devices=data.devices||[];
      DEVS={}; devices.forEach(function(d){DEVS[d.agent_id]=d;});
      var listening=0, closed=0;
      devices.forEach(function(d){ listening+=(d.observed||[]).length; closed+=(d.closed||[]).length; });
      var k={devices:devices.length, listening:listening, closed:closed};
      root.querySelectorAll('[data-pk]').forEach(function(el){
        var v=k[el.getAttribute('data-pk')]||0;
        if(window.countUp) window.countUp(el,v,{dur:400}); else el.textContent=v;
      });
      if(!devices.length){
        listEl.innerHTML='<div class="panel"><div class="panel__body"><div class="empty">No endpoints enrolled yet. Once an AV agent checks in, its open ports appear here.</div></div></div>';
        return;
      }
      if(!window.__portsSeen){
        window.__portsSeen=true;
        devices.forEach(function(d){ if(((d.observed||[]).length+(d.closed||[]).length)>0) expanded[d.agent_id]=true; });
        if(Object.keys(expanded).length===0 && devices[0]) expanded[devices[0].agent_id]=true;
      }
      listEl.innerHTML=devices.map(card).join('');
      bind();
    }

    function bind(){
      listEl.querySelectorAll('[data-toggle-card]').forEach(function(h){
        h.addEventListener('click', function(e){
          if(e.target.closest('[data-scan]')) return;
          toggleCard(h.closest('[data-device]').getAttribute('data-device'));
        });
      });
      listEl.querySelectorAll('[data-scan]').forEach(function(btn){
        btn.addEventListener('click', function(e){ e.stopPropagation(); scan(btn.getAttribute('data-scan'), btn); });
      });
      listEl.querySelectorAll('[data-obs-toggle]').forEach(function(h){
        h.addEventListener('click', function(e){
          e.stopPropagation();
          var aid = h.closest('[data-device]').getAttribute('data-device');
          var obs = h.closest('.obs');
          var open = obs.classList.toggle('is-open');
          obsOpen[aid] = open;
          var hint = h.querySelector('.muted');
          if (hint) hint.textContent = open ? '' : ' — click to expand';
        });
      });
      listEl.querySelectorAll('[data-toggle]').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation(); btn.disabled=true;
          var open=btn.getAttribute('data-state')==='closed';
          var ep='/api/agents/'+encodeURIComponent(btn.getAttribute('data-agent'))+'/ports/'+(open?'open':'close');
          var proto=btn.getAttribute('data-proto'), port=btn.getAttribute('data-port');
          reqJSON('POST',ep,{port:Number(port),proto:proto}).then(function(){
            if(window.toast) window.toast((open?'Re-opening ':'Closing ')+proto+'/'+port+' - enforced within ~60s', open?'good':'crit');
            load();
          }).catch(function(err){ btn.disabled=false; if(window.toast) window.toast('Failed: '+err.message,'crit'); });
        });
      });
      listEl.querySelectorAll('[data-cclose]').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var cardEl=btn.closest('[data-device]');
          var port=(cardEl.querySelector('[data-cport]').value||'').trim();
          var proto=cardEl.querySelector('[data-cproto]').value||'tcp';
          var reason=(cardEl.querySelector('[data-creason]').value||'').trim();
          if(!port||isNaN(Number(port))){ if(window.toast) window.toast('Enter a port number','info'); return; }
          btn.disabled=true;
          reqJSON('POST','/api/agents/'+encodeURIComponent(btn.getAttribute('data-agent'))+'/ports/close',{port:Number(port),proto:proto,reason:reason})
            .then(function(){ if(window.toast) window.toast('Closing '+proto+'/'+port+' within ~60s','crit'); load(); })
            .catch(function(err){ btn.disabled=false; if(window.toast) window.toast('Failed: '+err.message,'crit'); });
        });
      });
    }

    var expandAll=root.querySelector('[data-expand-all]');
    var collapseAll=root.querySelector('[data-collapse-all]');
    var scanAll=root.querySelector('[data-scan-all]');
    if(expandAll) expandAll.addEventListener('click', function(){ Object.keys(DEVS).forEach(function(a){expanded[a]=true;}); listEl.querySelectorAll('.port-dev').forEach(function(el){el.classList.add('is-open');}); });
    if(collapseAll) collapseAll.addEventListener('click', function(){ Object.keys(DEVS).forEach(function(a){expanded[a]=false;}); listEl.querySelectorAll('.port-dev').forEach(function(el){el.classList.remove('is-open');}); });
    if(scanAll) scanAll.addEventListener('click', function(){ Object.keys(DEVS).forEach(function(a){ scan(a,null); }); });

    function load(){ reqJSON('GET','/api/ports').then(ingest).catch(function(){ listEl.innerHTML='<div class="panel"><div class="panel__body"><div class="empty">Control plane offline - port management unavailable.</div></div></div>'; }); }
    load();
  }
};

      listEl.querySelectorAll('.seg button').forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.disabled || b.classList.contains('is-on')) return;
          var mode = b.getAttribute('data-mode'), aid = b.getAttribute('data-agent');
          if (mode === 'ips' && !window.confirm(
              'Enable IPS (inline) on this host?\n\nSuricata will sit inline via nftables NFQUEUE and ' +
              'CAN DROP traffic matching a drop rule. Enable only on a host you can recover. Continue?')) return;
          listEl.querySelectorAll('.seg button[data-agent="' + aid.replace(/"/g, '') + '"]').forEach(function (x) { x.disabled = true; });
          reqJSON('POST', '/api/agents/' + encodeURIComponent(aid) + '/nids', { mode: mode })
            .then(function () {
              if (window.toast) window.toast('Suricata → ' + mode.toUpperCase() + ' — applies within ~60s',
                mode === 'ips' ? 'crit' : (mode === 'ids' ? 'good' : 'info'));
              load();
            })
            .catch(function (e) { if (window.toast) window.toast('Failed: ' + e.message, 'crit'); load(); });
        });
      });
    }

    function render(data) {
      var devices = data.devices || [];
      var alerts = data.alerts || [];
      var k = { active: 0, ids: 0, ips: 0, alerts: alerts.length };
      devices.forEach(function (d) {
        if (d.nids_mode === 'ids') { k.ids++; k.active++; }
        else if (d.nids_mode === 'ips') { k.ips++; k.active++; }
      });
      root.querySelectorAll('[data-nk]').forEach(function (el) {
        var v = k[el.getAttribute('data-nk')] || 0;
        if (window.countUp) window.countUp(el, v, { dur: 400 }); else el.textContent = v;
      });
      listEl.innerHTML = devices.length
        ? devices.map(deviceCard).join('')
        : '<div class="panel"><div class="panel__body"><div class="empty">No endpoints enrolled yet.</div></div></div>';
      bind();
      if (alertsEl) alertsEl.innerHTML = alertRows(alerts);
      if (acEl) acEl.textContent = alerts.length + ' shown';
    }

    function load() {
      reqJSON('GET', '/api/nids').then(render).catch(function () {
        listEl.innerHTML = '<div class="panel"><div class="panel__body"><div class="empty">Control plane offline — IDS/IPS unavailable.</div></div></div>';
      });
    }
    // --- custom Suricata rules editor ---
    var customEl = root.querySelector('[data-nids-custom]');
    var customCountEl = root.querySelector('[data-nids-customcount]');
    var saveBtn = root.querySelector('[data-nids-save]');
    function countRules(t) {
      return (t || '').split('\n').filter(function (l) { var s = l.trim(); return s && s[0] !== '#'; }).length;
    }
    function loadCustom() {
      reqJSON('GET', '/api/nids/custom').then(function (d) {
        if (customEl) customEl.value = d.rules || '';
        if (customCountEl) customCountEl.textContent = (d.count || 0) + ' rules';
      }).catch(function () {});
    }
    if (customEl) customEl.addEventListener('input', function () {
      if (customCountEl) customCountEl.textContent = countRules(customEl.value) + ' rules';
    });
    if (saveBtn) saveBtn.addEventListener('click', function () {
      saveBtn.disabled = true;
      reqJSON('POST', '/api/nids/custom', { rules: customEl ? customEl.value : '' }).then(function (r) {
        saveBtn.disabled = false;
        if (customCountEl) customCountEl.textContent = (r.count || 0) + ' rules';
        if (window.toast) window.toast('Saved ' + (r.count || 0) + ' custom rule(s) — pushed to IDS/IPS hosts', 'good');
      }).catch(function (e) { saveBtn.disabled = false; if (window.toast) window.toast('Save failed: ' + e.message, 'crit'); });
    });
    loadCustom();

    // --- log-based IDS rules manager ---
    var lrBody = root.querySelector('[data-lr-body]');
    var lrCount = root.querySelector('[data-lr-count]');
    function lrRow(r) {
      var staged = r.verified === false;
      var origin = (r.origin && r.origin !== 'builtin')
        ? ' <span class="chip mono" style="font-size:10px">' + esc(r.origin) + '</span>' : '';
      var status = staged
        ? '<span class="badge badge--warn" title="Failed the false-positive self-check — not distributed until verified">staged</span>'
        : '<span class="badge badge--muted">ok</span>';
      var verifyBtn = staged
        ? '<button class="btn btn--ghost btn--sm" data-lr-verify title="Promote to verified after review">Verify</button> ' : '';
      return '<tr data-lr-id="' + r.id + '">' +
        '<td class="mono">' + esc(r.name) + origin + '</td>' +
        '<td>' + esc(r.platform) + '</td>' +
        '<td class="mono">' + esc(r.source) + '</td>' +
        '<td class="mono muted">' + esc(r.event_type) + '</td>' +
        '<td><span class="badge ' + sevBadge(r.severity) + '">' + esc(r.severity) + '</span></td>' +
        '<td>' + status + '</td>' +
        '<td><button type="button" class="lr-switch' + (r.enabled ? ' is-on' : '') + '" data-lr-toggle ' +
          'role="switch" aria-checked="' + (r.enabled ? 'true' : 'false') + '" ' +
          'title="' + (r.enabled ? 'Enabled — click to turn OFF' : 'Disabled — click to turn ON') + '">' +
          '<span class="lr-switch__k"></span></button></td>' +
        '<td style="text-align:right">' + verifyBtn +
          '<button class="btn btn--ghost btn--sm" data-lr-del title="Delete rule">&times;</button></td>' +
        '</tr>';
    }
    function loadLogRules() {
      reqJSON('GET', '/api/log-rules').then(function (d) {
        var rules = d.rules || [];
        if (lrCount) lrCount.textContent = rules.length + ' rules';
        if (lrBody) lrBody.innerHTML = rules.length
          ? rules.map(lrRow).join('')
          : '<tr><td colspan="8"><div class="empty">No log rules.</div></td></tr>';
      }).catch(function () {});
    }
    if (lrBody) lrBody.addEventListener('click', function (e) {
      var tr = e.target.closest('[data-lr-id]'); if (!tr) return;
      var id = tr.getAttribute('data-lr-id');
      var tog = e.target.closest('[data-lr-toggle]');
      if (tog) {
        var on = tog.classList.contains('is-on'); tog.disabled = true;
        reqJSON('POST', '/api/log-rules/' + id + '/toggle', { enabled: !on }).then(function () {
          loadLogRules();
          if (window.toast) window.toast('Rule ' + (on ? 'disabled' : 'enabled'), 'info');
        }).catch(function (er) { tog.disabled = false; if (window.toast) window.toast('Toggle failed: ' + er.message, 'crit'); });
      } else if (e.target.closest('[data-lr-verify]')) {
        var vb = e.target.closest('[data-lr-verify]'); vb.disabled = true;
        reqJSON('POST', '/api/log-rules/' + id + '/verify').then(function (res) {
          loadLogRules();
          if (window.toast) window.toast('Promoted to verified' + (res.self_check ? '' : ' (advisory: ' + res.advisory + ')'), res.self_check ? 'good' : 'info');
        }).catch(function (er) { vb.disabled = false; if (window.toast) window.toast('Verify failed: ' + er.message, 'crit'); });
      } else if (e.target.closest('[data-lr-del]')) {
        if (!window.confirm('Delete this log rule? It will be removed from the fleet policy.')) return;
        reqJSON('DELETE', '/api/log-rules/' + id).then(function () { loadLogRules(); if (window.toast) window.toast('Log rule deleted', 'info'); })
          .catch(function (er) { if (window.toast) window.toast('Delete failed: ' + er.message, 'crit'); });
      }
    });
    var lrSigma = root.querySelector('[data-lr-sigma]');
    if (lrSigma) lrSigma.addEventListener('click', function () {
      window.openModal(
        '<div class="modal__head"><strong>Import Sigma rules</strong></div>' +
        '<div class="modal__body stack">' +
          '<div class="muted" style="font-size:12px">Paste one or more <b>Sigma</b> YAML rules (separate with ' +
            '<span class="mono">---</span>). Sentinel converts them to log-IDS rules and runs a ' +
            '<b>false-positive self-check</b>; noisy/over-broad rules land <b>staged</b> (not distributed) ' +
            'for your review. Verified rules can be auto-enabled below.</div>' +
          '<div class="field"><textarea class="input mono" id="sig-yaml" rows="12" spellcheck="false" ' +
            'style="width:100%;resize:vertical;font-size:12px" placeholder="title: ...\\nlogsource: {product: windows, service: sysmon}\\ndetection:\\n  selection: {Image|endswith: \\\'\\\\powershell.exe\\\', CommandLine|contains: \\\'-enc\\\'}\\n  condition: selection\\nlevel: high\\ntags: [attack.t1059.001]"></textarea></div>' +
          '<label class="row" style="gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="sig-enable"> ' +
            'Auto-enable rules that pass the self-check</label>' +
          '<div class="muted" id="sig-result" style="font-size:12px;white-space:pre-wrap"></div>' +
        '</div>' +
        '<div class="modal__foot row" style="justify-content:flex-end;gap:8px">' +
          '<button class="btn btn--ghost" id="sig-cancel">Close</button>' +
          '<button class="btn btn--primary" id="sig-import">Import &amp; verify</button>' +
        '</div>'
      );
      var g = function (id) { return document.getElementById(id); };
      if (g('sig-yaml')) g('sig-yaml').focus();
      if (g('sig-cancel')) g('sig-cancel').addEventListener('click', window.closeModal);
      if (g('sig-import')) g('sig-import').addEventListener('click', function () {
        var y = g('sig-yaml').value || ''; if (!y.trim()) { g('sig-result').textContent = 'Paste at least one Sigma rule.'; return; }
        g('sig-import').disabled = true; g('sig-result').textContent = 'Converting + verifying…';
        reqJSON('POST', '/api/log-rules/sigma', { yaml: y, enable: !!g('sig-enable').checked }).then(function (r) {
          g('sig-import').disabled = false;
          var lines = ['Converted ' + r.converted + ' • verified ' + r.verified + ' • staged ' + r.staged +
                       (r.skipped && r.skipped.length ? ' • skipped ' + r.skipped.length : '')];
          (r.results || []).forEach(function (x) { lines.push('  ' + x.status.toUpperCase() + '  ' + x.name + (x.note ? ' — ' + x.note : '')); });
          (r.skipped || []).forEach(function (x) { lines.push('  SKIP  ' + x.title + ' — ' + x.reason); });
          g('sig-result').textContent = lines.join('\n');
          loadLogRules();
          if (window.toast) window.toast('Imported ' + r.added + ' Sigma rule(s) — ' + r.staged + ' staged', 'good');
        }).catch(function (e2) { g('sig-import').disabled = false; g('sig-result').textContent = 'Import failed: ' + e2.message; });
      });
    });
    var lrRefresh = root.querySelector('[data-lr-refresh]');
    if (lrRefresh) lrRefresh.addEventListener('click', loadLogRules);
    var lrAdd = root.querySelector('[data-lr-add]');
    if (lrAdd) lrAdd.addEventListener('click', function () {
      window.openModal(
        '<div class="modal__head"><strong>Add log-IDS rule</strong></div>' +
        '<div class="modal__body stack">' +
          '<div class="row" style="gap:8px;flex-wrap:wrap">' +
            '<div class="field" style="flex:1;min-width:160px"><label class="eyebrow" for="lr-name">Name</label><input class="input mono" id="lr-name" autocomplete="off" placeholder="my_rule"></div>' +
            '<div class="field" style="min-width:110px"><label class="eyebrow" for="lr-plat">Platform</label><select class="select" id="lr-plat"><option value="any">any</option><option value="linux">linux</option><option value="windows">windows</option></select></div>' +
            '<div class="field" style="min-width:110px"><label class="eyebrow" for="lr-src">Source</label><select class="select" id="lr-src"><option>auth</option><option>syslog</option><option>web</option><option>winsec</option><option>winsys</option><option>any</option></select></div>' +
          '</div>' +
          '<div class="field"><label class="eyebrow" for="lr-pat">Pattern (regex over a decoded log line)</label><input class="input mono" id="lr-pat" spellcheck="false" autocomplete="off" placeholder="Failed password .* from (\\d+\\.\\d+\\.\\d+\\.\\d+)"></div>' +
          '<div class="row" style="gap:8px;flex-wrap:wrap">' +
            '<div class="field" style="min-width:90px"><label class="eyebrow" for="lr-grp">Entity grp</label><input class="input mono" id="lr-grp" value="0" style="width:70px"></div>' +
            '<div class="field" style="min-width:90px"><label class="eyebrow" for="lr-thr">Threshold</label><input class="input mono" id="lr-thr" value="1" style="width:70px"></div>' +
            '<div class="field" style="min-width:90px"><label class="eyebrow" for="lr-win">Window s</label><input class="input mono" id="lr-win" value="300" style="width:80px"></div>' +
            '<div class="field" style="min-width:120px"><label class="eyebrow" for="lr-sev">Severity</label><select class="select" id="lr-sev"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></div>' +
          '</div>' +
          '<div class="row" style="gap:8px;flex-wrap:wrap">' +
            '<div class="field" style="flex:1;min-width:150px"><label class="eyebrow" for="lr-evt">Event type</label><input class="input mono" id="lr-evt" value="LOG_MATCH" autocomplete="off"></div>' +
            '<div class="field" style="flex:1;min-width:150px"><label class="eyebrow" for="lr-mit">MITRE (comma-sep)</label><input class="input mono" id="lr-mit" autocomplete="off" placeholder="T1110"></div>' +
          '</div>' +
          '<div class="muted" style="font-size:12px">Entity group = the regex capture group to correlate on (e.g. source IP); 0 = none. Threshold&gt;1 needs a window.</div>' +
          '<span class="muted" id="lr-err" style="font-size:12px;color:var(--crit);min-height:14px"></span>' +
        '</div>' +
        '<div class="modal__foot row" style="justify-content:flex-end;gap:8px">' +
          '<button class="btn btn--ghost" id="lr-cancel">Cancel</button>' +
          '<button class="btn btn--primary" id="lr-save">Add rule</button>' +
        '</div>'
      );
      var g = function (id) { return document.getElementById(id); };
      if (g('lr-name')) g('lr-name').focus();
      if (g('lr-cancel')) g('lr-cancel').addEventListener('click', window.closeModal);
      if (g('lr-save')) g('lr-save').addEventListener('click', function () {
        var err = g('lr-err'); err.textContent = '';
        var payload = { name: g('lr-name').value.trim(), platform: g('lr-plat').value, source: g('lr-src').value,
          pattern: g('lr-pat').value, entity_group: parseInt(g('lr-grp').value || '0', 10) || 0,
          threshold: parseInt(g('lr-thr').value || '1', 10) || 1, window_sec: parseInt(g('lr-win').value || '300', 10) || 300,
          severity: g('lr-sev').value, event_type: g('lr-evt').value.trim() || 'LOG_MATCH',
          mitre: g('lr-mit').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean) };
        if (!payload.name || !payload.pattern) { err.textContent = 'Name and pattern are required.'; return; }
        g('lr-save').disabled = true;
        reqJSON('POST', '/api/log-rules', payload).then(function () {
          window.closeModal(); loadLogRules();
          if (window.toast) window.toast('Log rule saved — pushed to agents on next policy sync', 'good');
        }).catch(function (e2) { g('lr-save').disabled = false; err.textContent = e2.message; });
      });
    });
    loadLogRules();

    var rb = root.querySelector('[data-nids-refresh]');
    if (rb) rb.addEventListener('click', function () { load(); loadCustom(); loadLogRules(); });
    load();
  }
};


/* ---- */

(function () {
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var truncHash = function (h) {
    h = String(h || "");
    return h.length > 22 ? h.slice(0, 12) + "…" + h.slice(-8) : h;
  };
  var scopeBadge = function (scope) {
    var s = String(scope || "").toUpperCase();
    var cls = s === "GLOBAL" ? "badge--accent" : "badge--muted";
    return '<span class="badge ' + cls + '">' + esc(s || "GLOBAL") + "</span>";
  };
  var scopeOptions = function (selected) {
    var AL = window.MOCK.allowlist;
    var out = '<option value="GLOBAL">Global (all instances)</option>';
    (AL.devices || []).forEach(function (d) {
      var sel = String(selected) === String(d) ? " selected" : "";
      out += '<option value="' + esc(d) + '"' + sel + ">" + esc(d) + "</option>";
    });
    return out;
  };

  var ipRow = function (r) {
    return (
      '<tr data-kind="ip" data-id="' + esc(r.id == null ? "" : r.id) + '" data-val="' + esc(r.value) + '">' +
      '<td class="mono">' + esc(r.value) + "</td>" +
      "<td>" + scopeBadge(r.scope) + "</td>" +
      '<td class="muted">' + esc(r.note || "—") + "</td>" +
      '<td class="mono muted num">' + esc(window.fmt.iso(r.added)) + "</td>" +
      '<td style="text-align:right"><button class="btn btn--ghost btn--sm" data-remove aria-label="Remove ' +
      esc(r.value) + '">Remove</button></td>' +
      "</tr>"
    );
  };
  var procRow = function (r) {
    return (
      '<tr data-kind="proc" data-id="' + esc(r.id == null ? "" : r.id) + '" data-val="' + esc(r.path) + '">' +
      '<td class="mono">' + esc(r.path) + "</td>" +
      '<td class="mono muted" title="' + esc(r.hash) + '">' + esc(truncHash(r.hash)) + "</td>" +
      "<td>" + scopeBadge(r.scope) + "</td>" +
      '<td class="mono muted num">' + esc(window.fmt.iso(r.added)) + "</td>" +
      '<td style="text-align:right"><button class="btn btn--ghost btn--sm" data-remove aria-label="Remove binary">Remove</button></td>' +
      "</tr>"
    );
  };

  window.views["allowlist"] = {
    title: "Allow-List",
    render: function () {
      var AL = window.MOCK.allowlist;
      var ips = AL.ips || [];
      var procs = AL.procs || [];

      return (
        '<div class="view-al stack">' +
        // ---- scope + KPIs ----
        '<div class="grid">' +
        '<div class="col-6">' +
        '<div class="panel">' +
        '<div class="panel__head"><span class="panel__title">Whitelisting scope</span>' +
        '<span class="dot dot--live" aria-hidden="true"></span></div>' +
        '<div class="panel__body">' +
        '<div class="row" style="align-items:flex-end;gap:var(--gap);flex-wrap:wrap">' +
        '<div class="field" style="min-width:240px;flex:1">' +
        '<label class="eyebrow" for="al-scope">Apply rules to</label>' +
        '<select class="select" id="al-scope">' + scopeOptions(AL.scope) + "</select>" +
        "</div>" +
        '<div class="stack" style="gap:4px">' +
        '<span class="eyebrow">Active scope</span>' +
        '<span class="mono" id="al-scope-label">Global (all instances)</span>' +
        "</div>" +
        "</div>" +
        "</div></div></div>" +

        '<div class="col-3"><div class="panel kpi">' +
        '<div class="kpi__label">IPs allow-listed</div>' +
        '<div class="kpi__value mono num" id="al-ip-count">0</div>' +
        '<div class="kpi__delta muted">CIDR + host entries</div>' +
        "</div></div>" +

        '<div class="col-3"><div class="panel kpi">' +
        '<div class="kpi__label">Binaries allow-listed</div>' +
        '<div class="kpi__value mono num" id="al-proc-count">0</div>' +
        '<div class="kpi__delta muted">Trusted process paths</div>' +
        "</div></div>" +
        "</div>" +

        // ---- two tables ----
        '<div class="grid">' +
        // IP panel
        '<div class="col-6"><div class="panel">' +
        '<div class="panel__head"><span class="panel__title">IP / CIDR allow-list</span>' +
        '<div class="panel__tools"><button class="btn btn--primary btn--sm" id="al-add-ip">+ Add IP</button></div></div>' +
        '<div class="panel__body">' +
        '<div class="tblwrap"><table class="tbl tbl--dense">' +
        "<thead><tr><th>Value</th><th>Scope</th><th>Note</th><th>Added</th><th></th></tr></thead>" +
        '<tbody id="al-ip-body">' +
        (ips.length ? ips.map(ipRow).join("") : "") +
        "</tbody></table></div>" +
        (ips.length ? "" : '<div class="empty">No IP allow-list entries.</div>') +
        "</div></div></div>" +

        // Proc panel
        '<div class="col-6"><div class="panel">' +
        '<div class="panel__head"><span class="panel__title">Process / Binary allow-list</span>' +
        '<div class="panel__tools"><button class="btn btn--primary btn--sm" id="al-add-proc">+ Add binary</button></div></div>' +
        '<div class="panel__body">' +
        '<div class="tblwrap"><table class="tbl tbl--dense">' +
        "<thead><tr><th>Path</th><th>SHA-256</th><th>Scope</th><th>Added</th><th></th></tr></thead>" +
        '<tbody id="al-proc-body">' +
        (procs.length ? procs.map(procRow).join("") : "") +
        "</tbody></table></div>" +
        (procs.length ? "" : '<div class="empty">No binary allow-list entries.</div>') +
        "</div></div></div>" +
        "</div>" +
        "</div>"
      );
    },

    init: function (root) {
      var AL = window.MOCK.allowlist;
      var ipBody = root.querySelector("#al-ip-body");
      var procBody = root.querySelector("#al-proc-body");
      var ipCountEl = root.querySelector("#al-ip-count");
      var procCountEl = root.querySelector("#al-proc-count");

      var refreshCounts = function () {
        var nIp = ipBody ? ipBody.querySelectorAll("tr").length : 0;
        var nProc = procBody ? procBody.querySelectorAll("tr").length : 0;
        if (ipCountEl) ipCountEl.textContent = window.fmt.int(nIp);
        if (procCountEl) procCountEl.textContent = window.fmt.int(nProc);
      };

      // count-up on first paint
      if (ipCountEl) window.countUp(ipCountEl, ipBody ? ipBody.querySelectorAll("tr").length : 0, {});
      if (procCountEl) window.countUp(procCountEl, procBody ? procBody.querySelectorAll("tr").length : 0, {});

      // ---- scope selector (cosmetic) ----
      var scopeSel = root.querySelector("#al-scope");
      var scopeLabel = root.querySelector("#al-scope-label");
      if (scopeSel) {
        scopeSel.addEventListener("change", function () {
          var v = scopeSel.value;
          var text = v === "GLOBAL" ? "Global (all instances)" : v;
          if (scopeLabel) scopeLabel.textContent = text;
          window.toast("Scope set to " + text, "info");
        });
      }

      // ---- remove (event delegation) ----
      var API = window.SENTINEL_API_BASE || '';
      var wireRemove = function (body, kind, key, arr, emptyMsg) {
        if (!body) return;
        body.addEventListener("click", function (e) {
          var btn = e.target.closest("[data-remove]");
          if (!btn) return;
          var tr = btn.closest("tr");
          if (!tr) return;
          var id = tr.getAttribute("data-id");
          var val = tr.getAttribute("data-val");
          var finish = function () {
            var i = (window.MOCK.allowlist[arr] || []).findIndex(function (r) {
              return String(r[key]) === String(val);
            });
            if (i > -1) window.MOCK.allowlist[arr].splice(i, 1);
            tr.remove();
            if (!body.querySelectorAll("tr").length) {
              var pb = body.closest(".panel__body");
              if (pb && !pb.querySelector(".empty")) {
                var em = window.el('<div class="empty">' + emptyMsg + "</div>");
                pb.appendChild(em);
              }
            }
            refreshCounts();
            window.toast(kind + " allow-list entry removed", "info");
          };
          if (id) {
            btn.disabled = true;
            fetch(API + "/api/allowlist/" + encodeURIComponent(id), { method: "DELETE" })

/* ---- */

(function(){
  var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

  var sevKey = function(sev){
    var s = String(sev||'').toUpperCase();
    if(s==='CRITICAL'||s==='CRIT') return 'crit';
    if(s==='HIGH') return 'serious';
    if(s==='MEDIUM'||s==='MED'||s==='WARNING'||s==='WARN') return 'warn';
    return 'good';
  };
  var sevColor = function(sev){
    var k = sevKey(sev);
    return k==='crit' ? 'var(--crit)' : k==='serious' ? 'var(--serious)' : k==='warn' ? 'var(--warn)' : 'var(--good)';
  };
  var actionBadge = function(action){
    var a = String(action||'').toUpperCase();
    var cls = 'badge--muted';
    if(a==='BLOCKED'||a==='ISOLATED') cls='badge--crit';                       // active containment / severe
    else if(a==='QUARANTINED'||a==='KILLED'||a==='DELETED'||a==='DROPPED') cls='badge--serious';
    else if(a==='DETECTED'||a==='LOGGED'||a==='ALERTED') cls='badge--accent';  // informational
    else if(a==='UNISOLATED'||a==='UNBLOCKED'||a==='RELEASED'||a==='RESTORED'||a==='WHITELISTED'||a==='ALLOWED') cls='badge--good';
    return '<span class="badge '+cls+'">'+esc(a||'—')+'</span>';
  };

  var sevBadge = function(sev){
    var s = String(sev||'').toUpperCase();
    var cls = 'badge--muted', label = s || '—';
    if(s==='CRITICAL'||s==='CRIT') cls='badge--crit';
    else if(s==='HIGH') cls='badge--serious';
    else if(s==='MEDIUM'||s==='MED') cls='badge--warn';
    else if(s==='LOW') cls='badge--good';
    return '<span class="badge '+cls+'">'+esc(label)+'</span>';
  };

  // 12-hour time first, then the date -> {time:"02:21:05 AM", date:"04 Aug 2026"}
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function pad2(n){ return (n<10?'0':'')+n; }
  function logTimeParts(ts){
    var d = new Date(ts);
    if(isNaN(d.getTime())) return { time: String(ts||'—'), date: '' };
    var h = d.getHours(), ap = h>=12?'PM':'AM', h12 = h%12; if(h12===0) h12=12;
    return {
      time: pad2(h12)+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds())+' '+ap,
      date: pad2(d.getDate())+' '+MON[d.getMonth()]+' '+d.getFullYear()
    };
  }

  var CHIPS = ['SURICATA','LOG-IDS','ROOTCHECK','ISOLATED','BLOCKED','DETECTED','CRITICAL','HIGH'];

  // Network field extractors — details vary by producer, so try several keys.
  function _det(rec){ return (rec.event||{}).details||{}; }
  function _pick(rec, keys){
    var d = _det(rec);
    for(var i=0;i<keys.length;i++){ if(d[keys[i]]!=null && d[keys[i]]!=='') return d[keys[i]]; }
    return null;
  }
  function srcIp(rec){
    var ioc = rec.ioc||{};
    return _pick(rec,['source_ip','src_ip','srcip']) || (ioc.type==='ip'?ioc.value:null) || '—';
  }
  function dstIp(rec){
    return _pick(rec,['dest_ip','destination_ip','dst_ip','dstip']) || (rec.instance||{}).ip_address || '—';
  }
  function srcPort(rec){ return _pick(rec,['source_port','src_port','sport']); }
  function dstPort(rec){ return _pick(rec,['dest_port','destination_port','dst_port','dport','destport']); }

  function recText(rec){ return JSON.stringify(rec).toLowerCase(); }

  function kvRow(label, valHtml){ return '<dt>'+esc(label)+'</dt><dd>'+valHtml+'</dd>'; }

  // Build the human-readable detail form (left) shown beside the raw JSON (right).
  function detailForm(rec){
    var ev = rec.event || {}, det = ev.details || {}, inst = rec.instance || {},
        ioc = rec.ioc || {}, mit = rec.mitre_attack || {}, pol = rec.policy || {},
        integ = rec.integrity || {};
    var tp = logTimeParts(rec.timestamp);
    var out = '<div class="lg-form">';
    // Overview
    out += '<div class="lg-sec">Overview</div><dl class="lg-kv">';
    out += kvRow('Time', '<span class="mono">'+esc(tp.time)+'</span> <span class="mono muted">'+esc(tp.date)+'</span>');
    out += kvRow('Device', esc(inst.device_name||'—'));
    if(inst.uuid) out += kvRow('Agent UUID', '<span class="mono">'+esc(inst.uuid)+'</span>');
    if(inst.ip_address) out += kvRow('Agent IP', '<span class="mono">'+esc(inst.ip_address)+'</span>');
    if(inst.platform) out += kvRow('Platform', esc(inst.platform));
    if(integ.producer) out += kvRow('Producer', esc(integ.producer));
    out += '</dl>';
    // Event
    out += '<div class="lg-sec">Event</div><dl class="lg-kv">';
    out += kvRow('Type', '<span class="mono">'+esc(ev.type||'—')+'</span>');
    out += kvRow('Severity', sevBadge(ev.severity));
    out += kvRow('Action', actionBadge(ev.action_taken));
    if(ev.mode) out += kvRow('Mode', esc(ev.mode));
    if(ev.confidence!=null) out += kvRow('Confidence', esc(ev.confidence)+'%');
    out += '</dl>';
    // Network (source/destination IP + ports)
    var sip = srcIp(rec), dip = dstIp(rec), sp = srcPort(rec), dp = dstPort(rec);
    if(sip!=='—' || dip!=='—' || sp || dp){
      out += '<div class="lg-sec">Network</div><dl class="lg-kv">';
      out += kvRow('Source IP', '<span class="mono">'+esc(sip)+'</span>' + (sp?' <span class="muted mono">:'+esc(sp)+'</span>':''));
      if(sp) out += kvRow('Source Port', '<span class="mono">'+esc(sp)+'</span>');
      out += kvRow('Destination IP', '<span class="mono">'+esc(dip)+'</span>' + (dp?' <span class="muted mono">:'+esc(dp)+'</span>':''));
      if(dp) out += kvRow('Destination Port', '<span class="mono">'+esc(dp)+'</span>');
      out += '</dl>';
    }
    // Indicator
    if(ioc.value!=null || ioc.type){
      out += '<div class="lg-sec">Indicator</div><dl class="lg-kv">';
      if(ioc.value!=null) out += kvRow('Value', '<span class="mono">'+esc(ioc.value)+'</span>');
      if(ioc.type) out += kvRow('Type', esc(ioc.type));
      if(ioc.confidence!=null) out += kvRow('Confidence', esc(ioc.confidence)+'%');
      out += '</dl>';
    }
    // Details (dynamic)
    var dk = Object.keys(det);
    if(dk.length){
      out += '<div class="lg-sec">Details</div><dl class="lg-kv">';
      dk.forEach(function(k){
        var v = det[k];
        if(v && typeof v === 'object') v = JSON.stringify(v);
        out += kvRow(k.replace(/_/g,' '), '<span class="mono">'+esc(String(v))+'</span>');
      });
      out += '</dl>';
    }
    // MITRE
    var techIds = (mit.technique_ids && mit.technique_ids.length) ? mit.technique_ids
                 : (mit.technique_id ? [mit.technique_id] : []);
    if(techIds.length || mit.technique || mit.tactic){
      out += '<div class="lg-sec">MITRE ATT&amp;CK</div><dl class="lg-kv">';
      if(mit.tactic) out += kvRow('Tactic', esc(mit.tactic));
      if(mit.technique) out += kvRow('Technique', esc(mit.technique));
      if(techIds.length) out += kvRow('Technique IDs',
        techIds.map(function(t){ return '<span class="badge badge--accent mono">'+esc(t)+'</span>'; }).join(' '));
      out += '</dl>';
    }
    // Policy
    if(pol && Object.keys(pol).length){
      out += '<div class="lg-sec">Policy</div><dl class="lg-kv">';
      if(pol.allowlisted!=null) out += kvRow('Allowlisted', pol.allowlisted
        ? '<span class="badge badge--good">yes</span>' : '<span class="badge badge--muted">no</span>');
      if(pol.matching_ioc_type) out += kvRow('Matched IOC', esc(pol.matching_ioc_type));
      out += '</dl>';
    }
    out += '</div>';
    return out;
  }

  function rowsHtml(list){
    if(!list.length){
      return '<tr><td colspan="9"><div class="empty">No log records match your query.</div></td></tr>';
    }
    return list.map(function(rec, i){
      var ev = rec.event || {};
      var det = ev.details || {};
      var inst = rec.instance || {};
      var mit = rec.mitre_attack || {};
      var sip = srcIp(rec), dip = dstIp(rec);
      var stripe = sevColor(ev.severity);
      var tech = mit.technique || '—';
      var techId = mit.technique_id || (mit.technique_ids && mit.technique_ids[0]) || '';
      var tp = logTimeParts(rec.timestamp);
      var idx = String(i);
      var main = ''+
        '<tr class="lg-row" data-idx="'+idx+'" tabindex="0" role="button" aria-expanded="false" title="Click to expand details">'+

          '<td style="white-space:nowrap"><span class="mono">'+esc(tp.time)+'</span> <span class="mono muted">'+esc(tp.date)+'</span></td>'+
          '<td>'+esc(inst.device_name||'—')+'</td>'+
          '<td class="mono">'+esc(sip)+'</td>'+
          '<td class="mono">'+esc(dip)+'</td>'+
          '<td>'+esc(ev.type||'—')+'</td>'+
          '<td>'+sevBadge(ev.severity)+'</td>'+
          '<td>'+actionBadge(ev.action_taken)+'</td>'+
          '<td>'+esc(tech)+(techId ? ' <span class="badge badge--accent mono">'+esc(techId)+'</span>' : '')+'</td>'+
        '</tr>';
      var detail = ''+
        '<tr class="lg-detail" data-detail="'+idx+'" hidden>'+

              detailForm(rec)+

              '</div>'+

      return main + detail;
    }).join('');
  }

  window.views["logs"] = {
    title: "Log Search",
    render: function(){
      var chips = CHIPS.map(function(c){
        return '<button type="button" class="chip" data-chip="'+c+'">'+c+'</button>';
      }).join('');
      return ''+
      '<div class="view" data-view="logs">'+
        '<div class="panel">'+
          '<div class="panel__head">'+
            '<div class="panel__title">Power Query</div>'+
            '<div class="panel__tools"><span class="eyebrow" id="lg-count"></span></div>'+
          '</div>'+
          '<div class="panel__body stack">'+
            '<div class="row" style="gap:10px;align-items:center;flex-wrap:wrap">'+
              '<input id="lg-search" class="input search mono" type="search" spellcheck="false" autocomplete="off" '+
                'placeholder=\'device:"prod-srv-db-01" AND mitre.technique_id:T1059.004 AND severity:HIGH\' '+
                'aria-label="Log search query" style="flex:1;min-width:240px" />'+
              '<span class="eyebrow muted" style="white-space:nowrap">Time range</span>'+
              '<select id="lg-time" class="input" style="max-width:170px" aria-label="Time range">'+
                '<option value="all">All time</option>'+
                '<option value="1h">Last hour</option>'+
                '<option value="24h">Last 24 hours</option>'+
                '<option value="7d">Last 7 days</option>'+
                '<option value="30d">Last 30 days</option>'+
                '<option value="365d">Last 1 year</option>'+
                '<option value="custom">Custom range&hellip;</option>'+
              '</select>'+
            '</div>'+
            '<div id="lg-custom" class="row" style="display:none;gap:6px;align-items:center;flex-wrap:wrap">'+
              '<span class="eyebrow muted" style="white-space:nowrap">From</span>'+

          '</div>'+
        '</div>'+
        '<div class="panel" style="margin-top:var(--gap)">'+
          '<div class="panel__head">'+
            '<div class="panel__title">Results</div>'+
            '<div class="panel__tools eyebrow">Click a row for a detailed breakdown + raw JSON</div>'+
          '</div>'+
          '<div class="panel__body">'+
            '<div class="tblwrap">'+
              '<table class="tbl tbl--dense">'+
                '<thead><tr>'+
                  '<th aria-label="severity"></th>'+
                  '<th>Timestamp</th>'+
                  '<th>Device</th>'+
                  '<th>Source IP</th>'+
                  '<th>Destination IP</th>'+
                  '<th>Event</th>'+
                  '<th>Severity</th>'+
                  '<th>Action</th>'+

          '</div>'+
        '</div>'+
      '</div>';
    },
    init: function(root){
      var logs = (window.MOCK && window.MOCK.logs) ? window.MOCK.logs : [];
      var body = root.querySelector('#lg-body');
      var search = root.querySelector('#lg-search');
      var chipsWrap = root.querySelector('#lg-chips');
      var countEl = root.querySelector('#lg-count');
      var timeSel = root.querySelector('#lg-time');
      var customWrap = root.querySelector('#lg-custom');
      var fromEl = root.querySelector('#lg-from');
      var toEl = root.querySelector('#lg-to');
      var activeChips = {};
      var DAY = 864e5;
      // cap custom range to 1 year
      (function(){
        var now = new Date(), yearAgo = new Date(Date.now() - 365*DAY);
        function iso(d){ return d.toISOString().slice(0,16); }
        if(fromEl){ fromEl.min = iso(yearAgo); fromEl.max = iso(now); }
        if(toEl){ toEl.min = iso(yearAgo); toEl.max = iso(now); }
      })();

      function timeBounds(){
        var v = timeSel ? timeSel.value : 'all';
        if(v==='all') return null;
        if(v==='custom'){
          var f = (fromEl && fromEl.value) ? new Date(fromEl.value).getTime() : null;
          var t = (toEl && toEl.value) ? new Date(toEl.value).getTime() : null;
          if(f!=null && t!=null && t-f > 365*DAY) f = t - 365*DAY;   // enforce max 1 year span
          return { from: f, to: t };
        }
        var span = { '1h':36e5, '24h':DAY, '7d':7*DAY, '30d':30*DAY, '365d':365*DAY }[v];
        return { from: Date.now() - span, to: null };
      }

      function compute(){
        var q = (search.value||'').trim().toLowerCase();
        var terms = q ? q.split(/\s+(?:and\s+)?/i).filter(function(t){ return t && t!=='and'; }) : [];
        var chipTerms = Object.keys(activeChips).filter(function(k){ return activeChips[k]; }).map(function(k){ return k.toLowerCase(); });
        var tb = timeBounds();
        return logs.filter(function(rec){
          var txt = recText(rec);
          for(var i=0;i<terms.length;i++){ if(txt.indexOf(terms[i])===-1) return false; }
          for(var j=0;j<chipTerms.length;j++){ if(txt.indexOf(chipTerms[j])===-1) return false; }
          if(tb){
            var t = new Date(rec.timestamp).getTime();
            if(isNaN(t)) return false;
            if(tb.from!=null && t < tb.from) return false;
            if(tb.to!=null && t > tb.to) return false;
          }
          return true;
        });
      }

      function wireRows(){
        var rows = body.querySelectorAll('.lg-row');
        rows.forEach(function(r){
          var toggle = function(){
            var idx = r.getAttribute('data-idx');
            var d = body.querySelector('.lg-detail[data-detail="'+idx+'"]');
            if(!d) return;
            var open = !d.hasAttribute('hidden');
            if(open){ d.setAttribute('hidden',''); r.setAttribute('aria-expanded','false'); }
            else { d.removeAttribute('hidden'); r.setAttribute('aria-expanded','true'); }
          };
          r.addEventListener('click', toggle);
          r.addEventListener('keydown', function(e){
            if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); }
          });
        });
        // Copy text robustly. navigator.clipboard exists ONLY in a secure context
        // (HTTPS / localhost); the console is usually served over plain HTTP on a LAN IP,
        // so fall back to the legacy execCommand('copy') via a temporary textarea.
        function fallbackCopy(text){
          try{
            var ta = document.createElement('textarea');
            ta.value = text; ta.setAttribute('readonly','');
            ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            try{ ta.setSelectionRange(0, text.length); }catch(_){}
            var ok = document.execCommand('copy');
            document.body.removeChild(ta);
            return ok;
          }catch(_){ return false; }
        }
        body.querySelectorAll('[data-copy]').forEach(function(btn){
          btn.addEventListener('click', function(e){
            e.stopPropagation();
            var idx = btn.getAttribute('data-copy');
            var pre = body.querySelector('pre[data-json="'+idx+'"]');
            if(!pre) return;
            var text = pre.textContent || '';
            var done = function(ok){
              if(ok){
                btn.textContent='Copied'; setTimeout(function(){ btn.textContent='Copy'; }, 1400);
                if(window.toast) window.toast('JSON copied to clipboard','good');
              } else if(window.toast){
                window.toast('Copy failed — select the JSON and press Ctrl+C','info');
              }
            };
            if(navigator.clipboard && navigator.clipboard.writeText){        // secure context
              navigator.clipboard.writeText(text).then(function(){ done(true); },
                                                       function(){ done(fallbackCopy(text)); });
            } else {                                                          // plain HTTP
              done(fallbackCopy(text));
            }
          });
        });
      }

      function apply(){
        var list = compute();
        body.innerHTML = rowsHtml(list);
        if(countEl) countEl.textContent = list.length + ' of ' + logs.length + ' records';
        wireRows();
      }

      search.addEventListener('input', apply);

      if(timeSel) timeSel.addEventListener('change', function(){
        if(customWrap) customWrap.style.display = (timeSel.value==='custom') ? 'flex' : 'none';
        apply();
      });
      if(fromEl) fromEl.addEventListener('change', apply);
      if(toEl) toEl.addEventListener('change', apply);

      chipsWrap.querySelectorAll('[data-chip]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var c = btn.getAttribute('data-chip');
          activeChips[c] = !activeChips[c];
          btn.classList.toggle('chip--active', !!activeChips[c]);
          apply();
          if(window.toast && activeChips[c]) window.toast('Filter: '+c, 'info');
        });
      });

      apply();
    }
  };
})();

(function () {
  function boot() { if (window.__boot) window.__boot(); }
  var API = (window.SENTINEL_API_BASE || '');
  var SEV = { HIGH: 'crit', MEDIUM: 'serious', LOW: 'warn', CRITICAL: 'crit' };
  function mapLive(d) {
    var M = window.MOCK = window.MOCK || {};
    if (d.stats) { M.stats = M.stats || {}; Object.keys(d.stats).forEach(function (k) { M.stats[k] = d.stats[k]; }); }
    M.iocs = M.iocs || {};
    if (d.iocs && d.iocs.ips) M.iocs.ips = d.iocs.ips.map(function (x) {
      return { value: x.value, source: x.source || '-', confidence: x.confidence || 0, first_seen: x.first_seen, mitre: '' }; });
    if (d.iocs && d.iocs.hashes) M.iocs.hashes = d.iocs.hashes.map(function (x) {
      return { value: x.value, type: 'sha256', malware: x.malware || '-', source: x.source || '-', first_seen: x.first_seen }; });
    if (d.iocs && d.iocs.drivers) M.iocs.drivers = d.iocs.drivers.map(function (x) {
      return { value: x.value, source: x.source || 'LOLDrivers', malware: x.malware || '', first_seen: x.first_seen }; });
    if (d.iocs && d.iocs.domains && d.iocs.domains.length) M.iocs.domains = d.iocs.domains.map(function (x) {
      return { value: x.value, source: x.source || '-', category: x.malware || '-', first_seen: x.first_seen }; });
    if (d.signatures) M.iocs.yara = d.signatures.map(function (s) {
      return { name: s.name, desc: (s.kind || 'yara') + ' · ' + (s.mitre || []).join(', '), severity: (s.severity || 'HIGH').toLowerCase() }; });
    if (d.suricata_rules) M.iocs.suricata = d.suricata_rules.map(function (r) {
      return { sid: r.sid, action: r.action, msg: r.msg, category: r.category, source: r.source }; });
    M.iocs.rules = [];   // no auto-generated Wazuh rules yet (detect-only)
    // true per-type totals (uncapped) for the IOC & Rule Center badges/header;
    // the rows above are the newest-N preview, these are the real counts.
    if (d.counts) M.iocCounts = d.counts;
    if (d.feeds) M.feeds = d.feeds;   // real threat-intel feed health (per-source counts)
    M.agentVersions = d.agent_versions || M.agentVersions || {};
    if (d.groups) M.groups = d.groups;
    if (d.agents) M.fleet = d.agents.map(function (a) {
      return { device_name: a.name, uuid: a.id, ip_address: a.ip || '-', os: a.os || '-', agent_version: a.version || '-',
               status: a.status || 'online', uptime: '-', last_seen: a.last_seen, isolated: !!a.isolated,
               platform: a.platform || 'linux', update_requested: !!a.update_requested,
               group_id: (a.group_id == null ? null : a.group_id),
               cpu: a.cpu || 0, mem: a.mem || 0, disk: a.disk || 0, disk_total: a.disk_total || 0,
               disk_free: a.disk_free || 0, disk_drives: a.disk_drives || [],
               win_telemetry: a.win_telemetry || {},
               spark: (a.spark && a.spark.length) ? a.spark : [a.cpu || 0] }; });

    // ---- real machine events only (replaces the mock demo data) ----
    var dets = d.detections || [];
    M.logs = dets.map(function (x) {
      var ev = x.event || { timestamp: x.ts, instance: {},
        event: { type: x.event_type, action_taken: x.action_taken, severity: x.severity, details: {} },
        mitre_attack: { technique_id: (x.mitre && x.mitre[0]) || null } };
      // device_name column is authoritative (reflects renames) — overlay it so
      // historical log rows show the current name, not the name captured at event time.
      if (x.device_name) { ev.instance = ev.instance || {}; ev.instance.device_name = x.device_name; }
      return ev;
    });
    M.criticalAlerts = dets.slice(0, 10).map(function (x) {
      return { ts: x.ts, device: x.device_name || '-', srcip: x.ioc_value || '-',
               technique: (x.mitre && x.mitre[0]) || '-', techId: (x.mitre && x.mitre[0]) || '-',
               action: x.action_taken || 'DETECTED', severity: SEV[(x.severity || 'HIGH')] || 'warn' }; });
    var sev = { crit: 0, serious: 0, warn: 0, info: 0 };
    dets.forEach(function (x) {
      var s = (x.severity || '').toUpperCase();
      if (s === 'CRITICAL') sev.crit++; else if (s === 'HIGH') sev.serious++;
      else if (s === 'MEDIUM') sev.warn++; else sev.info++;
    });
    M.severity = [{ label: 'Critical', value: sev.crit, key: 'crit' }, { label: 'Serious', value: sev.serious, key: 'serious' },
                  { label: 'Warning', value: sev.warn, key: 'warn' }, { label: 'Info', value: sev.info, key: 'info' }];
    var buckets = []; for (var h = 0; h < 24; h++) buckets.push(0);
    dets.forEach(function (x) { var t = new Date(x.ts); if (!isNaN(t.getTime())) buckets[t.getHours()]++; });
    M.events24h = buckets.map(function (n, h) { return { hour: (h < 10 ? '0' : '') + h + ':00', total: n }; });
    var mc = {}; dets.forEach(function (x) { (x.mitre || []).forEach(function (m) { mc[m] = (mc[m] || 0) + 1; }); });
    M.mitreTactics = Object.keys(mc).map(function (k) { return { id: k, name: k, count: mc[k] }; })
      .sort(function (a, b) { return b.count - a.count; }).slice(0, 8);
    if (!M.mitreTactics.length) M.mitreTactics = [{ id: '—', name: 'no events', count: 0 }];
    // detect-only: nothing is actually blocked, and no allow-list is enforced yet
    M.blocked = [];
    var alSrc = d.allowlist || {};
    M.allowlist = {
      scope: 'GLOBAL',
      devices: (d.agents || []).map(function (a) { return a.name; }),
      ips: (alSrc.ips || []).map(function (x) {
        return { id: x.id, value: x.value, scope: x.scope || 'GLOBAL', note: x.note || '', added: x.added }; }),
      procs: (alSrc.binaries || []).map(function (x) {
        return { id: x.id, path: x.value, hash: x.sha256 || '', scope: x.scope || 'GLOBAL', added: x.added }; })
    };
    window.__LIVE__ = true;
  }
  // Re-pull live data and re-render the current view (used after a feed sync).
  window.refreshDashboard = function () {
    return fetch(API + '/api/dashboard').then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d) { try { mapLive(d); } catch (e) {} if (window.navigate) window.navigate(); } });
  };
  try {
    var ctrl = new AbortController(); var t = setTimeout(function () { ctrl.abort(); }, 2500);
    fetch(API + '/api/dashboard', { signal: ctrl.signal })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { clearTimeout(t); if (d) { try { mapLive(d); } catch (e) {} } boot(); })
      .catch(function () { clearTimeout(t); boot(); });
  } catch (e) { boot(); }
})();
</script>
